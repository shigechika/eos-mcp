[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eos-mcp"
version = "1.1.1"
description = "MCP server for Arista EOS device operations via eAPI"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    {name = "AIKAWA Shigechika"},
]
keywords = ["arista", "eos", "eapi", "mcp", "model-context-protocol", "network", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "mcp>=1.0",
    "pyeapi",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[project.scripts]
eos-mcp = "eos_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/shigechika/eos-mcp"
Repository = "https://github.com/shigechika/eos-mcp"
Issues = "https://github.com/shigechika/eos-mcp/issues"

[tool.setuptools]
packages = ["eos_mcp"]

[tool.ruff]
target-version = "py310"
line-length = 120
# The smoke-test engine is shared verbatim with the other servers that use this
# harness and is formatted at a narrower width there. Reformatting it here would
# make every future sync produce a spurious diff and invite the copies to drift
# apart, so it is excluded from *formatting* only — `ruff check` does not consult
# this list, so its lint rules still apply.
format.exclude = ["scripts/smoke_harness.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
